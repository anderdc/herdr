onboarding = false
# herdr configuration — keybindings mirrored from ~/.tmux.conf (prefix C-a, | / - splits,
# prefix hjkl resize, prefix m zoom, prefix r reload, ctrl+hjkl navigation à la vim-tmux-navigator)

[keys]
# tmux: set -g prefix C-a
prefix = "ctrl+a"

# tmux: prefix d (tmux default detach)
detach = "prefix+d"

# tmux: bind r source-file ~/.tmux.conf
reload_config = "prefix+r"
# resize mode moved off prefix+r to make room for reload
resize_mode = "prefix+shift+r"

# tmux: bind | split-window -h (side-by-side), bind - split-window -v (stacked)
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# tmux: bind -r m resize-pane -Z (zoom toggle)
zoom = "prefix+m"

# vim-tmux-navigator: ctrl+hjkl (no prefix) is owned by the vim-herdr-navigation plugin
# ([[keys.command]] at the end of [keys]) — moves between nvim splits inside nvim, herdr
# panes everywhere else. Built-in pane focus is cleared so only the plugin binds fire.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

# tmux: bind -r h/j/k/l resize-pane by 5
resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"

# nvim tab binds (leader to/tx/tn/tp): herdr has no key sequences, so keep the final letter.
# <leader>to → prefix+t new tab; <leader>tx → prefix+x close tab (tabs close often, panes rarely);
# <leader>tn/<leader>tp → prefix+n / prefix+p (herdr defaults, unchanged).
new_tab = "prefix+t"
close_tab = "prefix+x"
close_pane = "prefix+shift+x"

# prefix+c freed up by moving new_tab to t — reuse the tmux new-window reflex for new spaces
new_workspace = "prefix+c"

# Cycle focus through live agents (any space), vim j/k style; alt+1..9 jumps to the Nth agent row
next_agent = "prefix+shift+j"
previous_agent = "prefix+shift+k"
focus_agent = "prefix+alt+1..9"

# Navigate mode (opened via prefix+w / prefix+g): vim-style j/k to flip workspaces.
# Arrows still work (left/right always focus panes, up/down workspaces).
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# j/k default to pane down/up in navigate mode — cleared so they belong to workspaces
# (arrow keys still focus panes; ctrl+hjkl handles pane focus outside navigate mode anyway)
navigate_pane_down = ""
navigate_pane_up = ""

# Plugin: vim-herdr-navigation. Needs the editor side too: ~/.config/nvim loads the
# plugin's editor/nvim.lua from its vim-tmux-navigator spec.
[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

# Plugin: herdr-lazygit. prefix+g = open/focus/close the 42-col git sidebar (in lazygit:
# C = AI commit message, U = expand to full layout). Own tab on prefix+alt+g instead of the
# documented prefix+shift+g, which herdr keeps for new_worktree.
[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "herdr-lazygit.open"
description = "lazygit sidebar"

[[keys.command]]
key = "prefix+alt+g"
type = "plugin_action"
command = "herdr-lazygit.open-tab"
description = "lazygit in its own tab"

[theme]
name = "gruvbox"
auto_switch = false

[ui]
# tmux-style splits: shared divider lines, no gaps, no outer frame
pane_gaps = false
pane_outer_borders = false
