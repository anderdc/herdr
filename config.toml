# herdr configuration — keybindings mirrored from ~/.tmux.conf (prefix C-a, | / - splits,
# prefix hjkl resize, prefix m zoom, prefix r reload, ctrl+hjkl navigation à la vim-tmux-navigator)

[keys]
# tmux: set -g prefix C-a
prefix = "ctrl+a"

# tmux: prefix d (tmux default detach)
detach = "prefix+d"

# tmux: bind r source-file ~/.tmux.conf
reload_config = "prefix+r"
# resize mode moved off prefix+r to make room for reload
resize_mode = "prefix+shift+r"

# tmux: bind | split-window -h (side-by-side), bind - split-window -v (stacked)
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# tmux: bind -r m resize-pane -Z (zoom toggle)
zoom = "prefix+m"

# vim-tmux-navigator: ctrl+hjkl focuses panes directly (no prefix)
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"

# tmux: bind -r h/j/k/l resize-pane by 5
resize_pane_left = "prefix+h"
resize_pane_down = "prefix+j"
resize_pane_up = "prefix+k"
resize_pane_right = "prefix+l"

# nvim tab binds (leader to/tx/tn/tp): herdr has no key sequences, so keep the final letter.
# <leader>to → prefix+t new tab; <leader>tx → prefix+x close tab (tabs close often, panes rarely);
# <leader>tn/<leader>tp → prefix+n / prefix+p (herdr defaults, unchanged).
new_tab = "prefix+t"
close_tab = "prefix+x"
close_pane = "prefix+shift+x"

# prefix+c freed up by moving new_tab to t — reuse the tmux new-window reflex for new spaces
new_workspace = "prefix+c"

# Cycle focus through live agents (any space), vim j/k style; alt+1..9 jumps to the Nth agent row
next_agent = "prefix+shift+j"
previous_agent = "prefix+shift+k"
focus_agent = "prefix+alt+1..9"

# Navigate mode (opened via prefix+w / prefix+g): vim-style j/k to flip workspaces.
# Arrows still work (left/right always focus panes, up/down workspaces).
navigate_workspace_up = "k"
navigate_workspace_down = "j"
# j/k default to pane down/up in navigate mode — cleared so they belong to workspaces
# (arrow keys still focus panes; ctrl+hjkl handles pane focus outside navigate mode anyway)
navigate_pane_down = ""
navigate_pane_up = ""

[theme]
name = "one-dark"
auto_switch = false

[ui]
# tmux-style splits: shared divider lines, no gaps, no outer frame
pane_gaps = false
pane_outer_borders = false
